
name: CI - Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Jest tests (Node 24)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AWDF-1/student-portfolio/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AWDF-1/student-portfolio/server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run automated API tests
        run: npm test
