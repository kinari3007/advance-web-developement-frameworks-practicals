# nginx.conf — Practical 11
# Nginx configuration for the React SPA served by the frontend container.
#
# Key concerns:
# 1. try_files $uri $uri/ /index.html — lets React Router handle all client-side
#    routes (/skills, /todo, /contact, etc.) without 404 from Nginx.
# 2. Gzip compression for JS/CSS bundles — reduces transfer size.
# 3. Cache-control headers for hashed assets (Vite adds content hashes).

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Hashed static assets — long cache ────────────────────────────────────
    # Vite generates filenames like index-C2CerVOi.js; these never collide.
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # ── React Router fallback ────────────────────────────────────────────────
    # For any path that isn't a real file, serve index.html so React Router
    # can handle the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
