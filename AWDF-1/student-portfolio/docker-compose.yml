# docker-compose.yml — Practical 11: Containerized Full-Stack Task Manager
#
# Three services:
#   taskmgr-mongodb   — MongoDB 7 with a persistent named volume
#   taskmgr-backend   — Express/Node.js API (Practicals 5–10)
#   taskmgr-frontend  — React/Vite SPA served by Nginx
#
# All services communicate over the private bridge network "app-network".
#
# IMPORTANT — root .env must define:
#   MONGO_ROOT_USER   root username for the MongoDB container
#   MONGO_ROOT_PASS   root password for the MongoDB container
#   MONGO_URI         full connection string the backend uses
#                     (must use service hostname taskmgr-mongodb, not localhost)
#   JWT_SECRET        long random string for JWT signing
#
# Copy .env.example → .env and fill in real values before running.

services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  taskmgr-mongodb:
    image: mongo:7
    container_name: taskmgr-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: awdf_tasks
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    # Port 27017 is intentionally NOT published to the host.
    # Only the backend container needs it; exposing it is unnecessary.

  # ── Backend ────────────────────────────────────────────────────────────────
  taskmgr-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskmgr-backend
    restart: unless-stopped
    depends_on:
      - taskmgr-mongodb
    environment:
      # MONGO_URI is read directly from the root .env.
      # It must use the Compose service hostname "taskmgr-mongodb" (not localhost).
      # Example value (set in root .env, never commit real credentials):
      #   MONGO_URI=mongodb://admin:changeme@taskmgr-mongodb:27017/awdf_tasks?authSource=admin
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in root .env}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in root .env}
    ports:
      # Host port 5001 → container port 5000.
      # Using 5001 avoids a conflict when the Node dev server is already
      # running on host port 5000 outside Docker.
      - "5001:5000"
    networks:
      - app-network

  # ── Frontend ───────────────────────────────────────────────────────────────
  taskmgr-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmgr-frontend
    restart: unless-stopped
    depends_on:
      - taskmgr-backend
    ports:
      # Nginx listens on 80 inside the container; mapped to 5173 on the host.
      - "5173:80"
    networks:
      - app-network

# ── Named volume ──────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    name: mongo-data

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  app-network:
    name: app-network
    driver: bridge
